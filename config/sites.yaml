sites:
  - id: c8888
    name: "8888.bg"
    url: "https://8888.bg/bonuses/"
    access: public
    render: js
    selector: ".bonus-cardbox"
    # Карточка открывается popup'ом БЕЗ своего URL (адрес не меняется), так что
    # ссылкой на конкретную акцию это не сделать. Полное описание берём из того
    # же JSON-эндпоинта, что вызывает сам сайт при клике (robots.txt разрешает),
    # и отчёт показывает его раскрывающейся строкой — см. scraper/details.py.
    details:
      id_attr: data-bonus-id
      url: "https://8888.bg/bonuses/detail/?id={id}"
      content_selector: ".bonus-detail-content"
      drop_selectors: [".bonus-cardbox"]  # дубль баннера карточки в начале popup'а
    # "Дойти до конца": у popup'а нет адреса вообще, поэтому Playwright открывает
    # его и снимает итоговый блок акции (scraper/popup_shots.py) — клик по акции в
    # отчёте открывает этот снимок. Пересоздаётся, только когда акция изменилась.
    popup_shots:
      id_attr: data-bonus-id
      open_selector: "a.absolute-full"
      ready_selector: ".bonus-detail-content-wrapper"
      popup_selector: ".popup-overlay.state-popup-open .popup-box"
      close_selector: ".popup-close"
      id_selector: "[data-bonus-id]"

  - id: inbet
    name: "Inbet"
    url: "https://inbet.com/ingame/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"

  - id: winbet
    name: "Winbet"
    url: "https://winbet.bg/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"
    # Начален welcome-бонус ("НАЧАЛЕН ALL INCLUSIVE БОНУС") виден публично,
    # без логина — авторизация не требуется для мониторинга этой страницы.

  # Palms Bet — исключён из мониторинга: страница акций закрыта Cloudflare
  # Turnstile-чэлленджем ("Verify you are human") два дня подряд, один и тот
  # же экран оба раза — похоже на постоянный гейт, а не разовую меру. Правила
  # проекта не допускают попыток его обхода (см. README), так что дальше
  # честно показывать "blocked_by_antibot" каждый день смысла нет — история
  # снапшотов palmsbet в storage/promo_monitor.db не удалена, просто больше
  # не пополняется.

  - id: mrbit
    name: "MrBit"
    url: "https://mrbit.bg/bg/promotions/offers"
    access: public
    render: js
    selector: ".promotions-event-preview_custom-offer"
    # Карточка открывается JS-обработчиком, <a href> нет. Адреса берём из JSON,
    # которым сама страница грузит список (scraper/link_apis.py): без кликов и
    # без лишних запросов. Slug из items[].url -> <страница списка>/<slug>.
    link_api:
      parser: mrbit
      url_contains: "api/offers/list"

  - id: sesame
    name: "Sesame"
    url: "https://sesame.bg/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"

  - id: betano
    name: "Betano"
    url: "https://www.betano.bg/"
    access: public
    render: js
    # Отдельной страницы промоакций нет — блок "Оферти" встроен в главную.
    # Селектор собран из нескольких utility-классов дизайн-системы сайта,
    # он менее устойчив к редизайну, чем семантические классы у других
    # сайтов — если поедет "no_selector_match", смотреть сюда в первую очередь.
    selector: '.cui-relative.cui-box-border.cui-cursor-pointer.cui-overflow-hidden'
    # Адреса плиток — из /api/bonus/stories (onClickAction.navigationUrl): у части
    # это страницы, у части панель на главной (/?panel=calendar&id=...), у
    # некоторых плиток адреса нет вовсе — они остаются со ссылкой на главную.
    link_api:
      parser: betano
      url_contains: "api/bonus/stories?section=1"

  - id: admiralbet
    name: "AdmiralBet"
    url: "https://www.admiralbet.bg/promotions"
    access: public
    render: js
    selector: "xbet-promotion-banner-full-card"
    # Адреса — из GetLayout?id=promotions (PromotionBanner.buttons[].navigationValue).
    link_api:
      parser: admiralbet
      url_contains: "GetLayout?id=promotions"

  - id: efbet
    name: "efbet"
    url: "https://efbet.com/promotions"
    access: public
    render: js
    # CSS-module класс с хэш-суффиксом (...___YpcKb) — суффикс меняется при
    # пересборке фронтенда сайта, поэтому матчим по стабильной части имени.
    selector: '[class*="PromotionItem-module__Container"]'
    # Адрес акции = /promotions/<категория>/<titleEn>, собирается из ответа
    # categories/promotions по правилу, сверенному с реальными кликами.
    link_api:
      parser: efbet
      url_contains: "categories/promotions"

  # Elitbet — исключён из мониторинга: акции там картинки-баннеры без текста
  # в DOM, отчёт по нему получался сплошным списком src-ссылок на изображения
  # без содержательного описания акции, бесполезно для чтения (см. историю
  # снапшотов elitbet в storage/promo_monitor.db — не удалялась, просто
  # больше не пополняется).

  # bet365 (casino.bet365.com) — не добавлен: этот домен заблокирован
  # политикой безопасности инструмента браузера у Claude, не удалось
  # даже открыть страницу для подбора селектора. Нужно either руками
  # прислать HTML/скриншот страницы акций, либо добавить сайт отдельно
  # с другого инструмента.
