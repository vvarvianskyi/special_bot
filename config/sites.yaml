sites:
  - id: c8888
    name: "8888.bg"
    url: "https://8888.bg/bonuses/"
    access: public
    render: js
    selector: ".bonus-cardbox"

  - id: inbet
    name: "Inbet"
    url: "https://inbet.com/ingame/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"

  - id: winbet
    name: "Winbet"
    url: "https://winbet.bg/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"
    # Начален welcome-бонус ("НАЧАЛЕН ALL INCLUSIVE БОНУС") виден публично,
    # без логина — авторизация не требуется для мониторинга этой страницы.

  - id: palmsbet
    name: "Palms Bet"
    url: "https://www.palmsbet.com/bg/promotions/"
    access: public
    render: js
    selector: '[role="listbox"][aria-label="Всички"] [role="option"]'

  - id: mrbit
    name: "MrBit"
    url: "https://mrbit.bg/bg/promotions/offers"
    access: public
    render: js
    selector: ".promotions-event-preview_custom-offer"

  - id: sesame
    name: "Sesame"
    url: "https://sesame.bg/promotions"
    access: public
    render: js
    selector: ".prm-lobby-card"

  - id: betano
    name: "Betano"
    url: "https://www.betano.bg/"
    access: public
    render: js
    # Отдельной страницы промоакций нет — блок "Оферти" встроен в главную.
    # Селектор собран из нескольких utility-классов дизайн-системы сайта,
    # он менее устойчив к редизайну, чем семантические классы у других
    # сайтов — если поедет "no_selector_match", смотреть сюда в первую очередь.
    selector: '.cui-relative.cui-box-border.cui-cursor-pointer.cui-overflow-hidden'

  - id: admiralbet
    name: "AdmiralBet"
    url: "https://www.admiralbet.bg/promotions"
    access: public
    render: js
    selector: "xbet-promotion-banner-full-card"

  - id: efbet
    name: "efbet"
    url: "https://efbet.com/promotions"
    access: public
    render: js
    # CSS-module класс с хэш-суффиксом (...___YpcKb) — суффикс меняется при
    # пересборке фронтенда сайта, поэтому матчим по стабильной части имени.
    selector: '[class*="PromotionItem-module__Container"]'

  # Elitbet — исключён из мониторинга: акции там картинки-баннеры без текста
  # в DOM, отчёт по нему получался сплошным списком src-ссылок на изображения
  # без содержательного описания акции, бесполезно для чтения (см. историю
  # снапшотов elitbet в storage/promo_monitor.db — не удалялась, просто
  # больше не пополняется).

  # bet365 (casino.bet365.com) — не добавлен: этот домен заблокирован
  # политикой безопасности инструмента браузера у Claude, не удалось
  # даже открыть страницу для подбора селектора. Нужно either руками
  # прислать HTML/скриншот страницы акций, либо добавить сайт отдельно
  # с другого инструмента.
